<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CalorieBot — Настройки</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="container">
    <h1>Дневные нормы</h1>

    <div id="loading">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <div id="errorBox" class="error-box" hidden>
      <div id="errorText"></div>
      <button id="retryBtn" class="btn" type="button">Повторить</button>
    </div>

    <form id="form" hidden autocomplete="off" onsubmit="return false">
      <div class="field">
        <label for="fieldCalories">Калории (ккал)</label>
        <input id="fieldCalories" class="text-input" type="text" inputmode="numeric">
        <div class="field-error" hidden></div>
      </div>
      <div class="field">
        <label for="fieldProtein">Белки (г)</label>
        <input id="fieldProtein" class="text-input" type="text" inputmode="numeric">
        <div class="field-error" hidden></div>
      </div>
      <div class="field">
        <label for="fieldFat">Жиры (г)</label>
        <input id="fieldFat" class="text-input" type="text" inputmode="numeric">
        <div class="field-error" hidden></div>
      </div>
      <div class="field">
        <label for="fieldCarbs">Углеводы (г)</label>
        <input id="fieldCarbs" class="text-input" type="text" inputmode="numeric">
        <div class="field-error" hidden></div>
      </div>
      <div id="macroHint" class="hint" style="margin-top: 16px"></div>
    </form>
  </main>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <a href="index.html"><svg class="tab-icon" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 8h6M9 12h6"/></svg><span>Дневник</span></a>
      <a href="stats.html"><svg class="tab-icon" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Статистика</span></a>
      <a href="settings.html" class="active"><svg class="tab-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Настройки</span></a>
    </div>
  </nav>

  <script type="module" src="settings.js"></script>
</body>
</html>
