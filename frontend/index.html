<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CalorieBot — Дневник</title>
  <link rel="stylesheet" href="style.css?v=20261019a">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1 id="greeting">Привет!</h1>
      <div id="dateLabel" class="hint"></div>
    </header>

    <div id="loading">
      <div class="skeleton" style="height: 120px; margin-top: 12px"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <div id="errorBox" class="error-box" hidden>
      <div id="errorText"></div>
      <button id="retryBtn" class="btn" type="button">Повторить</button>
    </div>

    <div id="content" hidden>
      <section class="card hero">
        <div class="hero-top">
          <div class="ring">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
              <circle id="ringFill" class="ring-fg" cx="60" cy="60" r="52"></circle>
            </svg>
            <div class="ring-center">
              <div id="ringValue" class="ring-value">0</div>
              <div class="ring-unit">ккал</div>
            </div>
          </div>
          <div class="hero-side">
            <div class="hero-label">Сегодня</div>
            <div id="kcalText" class="kcal-main"></div>
            <div id="kcalCaption"></div>
          </div>
        </div>
        <div class="macros">
          <div class="macro">
            <div class="macro-head"><span class="macro-name">Белки</span><span id="proteinText" class="macro-value"></span></div>
            <div class="macro-bar"><div id="proteinFill" class="macro-fill protein"></div></div>
          </div>
          <div class="macro">
            <div class="macro-head"><span class="macro-name">Жиры</span><span id="fatText" class="macro-value"></span></div>
            <div class="macro-bar"><div id="fatFill" class="macro-fill fat"></div></div>
          </div>
          <div class="macro">
            <div class="macro-head"><span class="macro-name">Углев.</span><span id="carbsText" class="macro-value"></span></div>
            <div class="macro-bar"><div id="carbsFill" class="macro-fill carbs"></div></div>
          </div>
        </div>
      </section>
      <div id="meals"></div>
    </div>
  </main>

  <nav class="tabbar">
    <div class="tabbar-inner">

    </div>
  </nav>

  <script type="module" src="diary.js?v=20261019a"></script>
</body>
</html>
