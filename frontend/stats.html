<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CalorieBot — Статистика</title>
  <link rel="stylesheet" href="style.css?v=20261013c">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <main class="container">
    <h1>Статистика</h1>

    <div id="periodSwitch" class="segmented">
      <button type="button" class="chip active" data-days="7">Неделя</button>
      <button type="button" class="chip" data-days="30">Месяц</button>
    </div>

    <div id="loading" hidden>
      <div class="skeleton" style="height: 260px; margin-top: 12px"></div>
    </div>

    <div id="errorBox" class="error-box" hidden>
      <div id="errorText"></div>
      <button id="retryBtn" class="btn" type="button">Повторить</button>
    </div>

    <div id="emptyState" class="state-text" hidden>За этот период нет записей</div>

    <div id="content" hidden>
      <div class="chart-box"><canvas id="chartCanvas"></canvas></div>
      <div class="stat-grid">
        <div class="stat">
          <div id="statCalories" class="stat-value"></div>
          <div class="stat-label">ккал в среднем</div>
        </div>
        <div class="stat">
          <div id="statProtein" class="stat-value"></div>
          <div class="stat-label">белки, г</div>
        </div>
        <div class="stat">
          <div id="statFat" class="stat-value"></div>
          <div class="stat-label">жиры, г</div>
        </div>
        <div class="stat">
          <div id="statCarbs" class="stat-value"></div>
          <div class="stat-label">углеводы, г</div>
        </div>
      </div>
      <div id="averageLine" class="hint stat-note"></div>
      <div id="daysLine" class="hint stat-note"></div>
    </div>
  </main>

    <div class="tabbar-inner">

    </div>
  </nav>

  <script type="module" src="stats.js?v=20261013c"></script>
</body>
</html>
